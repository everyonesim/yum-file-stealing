<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Rain World</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}
#unity-canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    outline: none;
}
#loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(380px, 84%);
    color: #fff;
    text-align: center;
}
#bar {
    height: 10px;
    margin-top: 15px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
}
#progress {
    height: 100%;
    width: 0%;
    background: #8da85c;
    transition: width .15s linear;
}
#error {
    color: #ff9a9a;
    margin-top: 15px;
    font-size: 13px;
    line-height: 1.45;
    overflow-wrap: anywhere;
}
#error:empty { display: none; }

/* Live asset readout: the game streams its data files with blocking
   requests, so region loads look frozen. Surface the traffic. */
#hud {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 10px;
    width: min(86%, 560px);
    padding: 8px 12px 10px;
    border-radius: 9px;
    background: rgba(0, 0, 0, .72);
    border: 1px solid rgba(255, 255, 255, .14);
    color: #cfe0b8;
    font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
    pointer-events: none;
    z-index: 5;
    transition: opacity .4s ease;
    opacity: .96;
}
#hud.dim { opacity: .55; }
#hudtext { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hudbar {
    margin-top: 7px;
    height: 8px;
    border-radius: 5px;
    background: rgba(255, 255, 255, .12);
    overflow: hidden;
}
#hudfill {
    height: 100%;
    width: 0%;
    background: #8da85c;
    transition: width .25s ease;
}
#hudfiles {
    margin-top: 5px;
    color: #8fa07d;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#assets {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 10px;
    max-width: min(86%, 620px);
    padding: 7px 11px;
    border-radius: 8px;
    background: rgba(0, 0, 0, .62);
    border: 1px solid rgba(255, 255, 255, .12);
    color: #cfe0b8;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#assets.show { opacity: 1; }

#banner {
    position: absolute;
    left: 50%;
    top: 14px;
    transform: translateX(-50%);
    width: min(680px, 92%);
    padding: 12px 15px;
    border-radius: 10px;
    background: #2a1214;
    border: 1px solid #7d2b30;
    color: #ffd9d9;
    font-size: 13px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    display: none;
}
#banner.show { display: block; }
#banner b { color: #fff; }
#banner code {
    display: block;
    margin-top: 6px;
    padding: 6px 8px;
    background: rgba(0, 0, 0, .45);
    border-radius: 6px;
    color: #ffe9a8;
    font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
#banner .hint { display: block; margin-top: 8px; color: #e7b9bb; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="0"></canvas>

<div id="loading">
    <div id="status">Loading Rain World...</div>
    <div id="bar"><div id="progress"></div></div>
    <div id="error"></div>
</div>

<div id="hud"><div id="hudtext">Loading Rain World...</div><div id="hudbar"><div id="hudfill"></div></div><div id="hudfiles"></div></div>
<div id="banner"></div>

<script>
(function () {
    "use strict";

    var BUILD = "Build/WebGLUnity6Build";
    // Bumped when Build/ changes, so a fix is not served from a stale cache.
    var BUILD_VERSION = "2026-11-13n";
    var ASSETS_PATH = "StreamingAssets";
    // Where the asset tree can also live if it is too big for Pages. selcdn and
    // jsDelivr were tried here and both refuse a tree this size, so the raw
    // branch is the remote source.
    var ASSET_BRANCH = "https://raw.githubusercontent.com/everyonesim/yum-file-stealing/game-assets/";

    // Checked in order. "" is this page's own folder, so the game works from
    // the repo root and from the old rain-world/ layout.
    var BUILD_BASES = ["", "rain-world/"];
    var ASSET_BASES = ["", "rain-world/", ASSET_BRANCH];

    var canvas = document.getElementById("unity-canvas");
    var loading = document.getElementById("loading");
    var progress = document.getElementById("progress");
    var statusEl = document.getElementById("status");
    var errorEl = document.getElementById("error");
    var hud = document.getElementById("hud");
    var hudText = document.getElementById("hudtext");
    var hudFill = document.getElementById("hudfill");
    var hudFiles = document.getElementById("hudfiles");
    var banner = document.getElementById("banner");

    // Anything that throws on this page, including inside a call the engine makes
    // into the patched file layer, goes on the bar instead of dying silently.
    window.addEventListener("error", function (event) {
        var message = event && event.message ? event.message : "script error";
        hudShow(0, "script error: " + message,
            (event && event.filename ? event.filename + ":" + (event.lineno || 0) : ""));
        console.error("Rain World script error:", message, event && event.filename, event && event.lineno);
    });
    window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason ? (event.reason.message || String(event.reason)) : "promise rejected";
        hudShow(0, "promise error: " + reason, "");
        console.error("Rain World promise error:", reason);
    });

    // A wasm abort or an out-of-memory only ever shows up on the console. Copy
    // the fatal ones onto the bar so a dead engine is not just a black screen.
    var nativeConsoleError = console.error.bind(console);
    console.error = function () {
        var text = Array.prototype.map.call(arguments, function (item) {
            return item instanceof Error ? item.message : String(item);
        }).join(" ");
        if (/abort|out of memory|memory access|runtimeerror|uncaught exception|cannot enlarge|enlarge memory|context_lost/i.test(text)) {
            hudShow(0, "engine error: " + text.slice(0, 160), "");
        }
        nativeConsoleError.apply(null, arguments);
    };

    // The engine talks to the console and nothing else, and a browser page has no
    // devtools on a phone. Keep the tail of what the game itself says and put it on
    // the bar, so a stop names its own cause.
    var consoleTail = [];
    var consoleNoise = /UnityCache|Downloading|preload|streamingassets|\.data|\.framework|\.wasm|unity\.js|BLOCKING|wasm streaming|WebGL: INVALID|unity-canvas/;
    function captureConsole(kind) {
        var original = console[kind];
        console[kind] = function () {
            try {
                var text = Array.prototype.map.call(arguments, function (item) {
                    return item instanceof Error ? (item.message || String(item)) : String(item);
                }).join(" ").replace(/\s+/g, " ").trim();
                if (text && text.length < 900 && !consoleNoise.test(text) && text.indexOf("Rain World") !== 0) {
                    consoleTail.push((kind === "error" ? "! " : "") + text);
                    if (consoleTail.length > 12) consoleTail.shift();
                }
            } catch (error) { /* a failing mirror must never break the game */ }
            return original.apply(null, arguments);
        };
    }
    captureConsole("log");
    captureConsole("warn");
    captureConsole("error");

    var bannerShown = false;

    function showBanner(title, detail, hint) {
        if (bannerShown && title !== "Game stopped") { /* keep first error */ }
        bannerShown = true;
        banner.innerHTML = "<b>" + escapeHtml(title) + "</b>" +
            (detail ? "<code>" + escapeHtml(detail) + "</code>" : "") +
            (hint ? "<span class='hint'>" + escapeHtml(hint) + "</span>" : "");
        banner.classList.add("show");
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    function setStatus(text) {
        statusEl.textContent = text;
    }

    // ---------------------------------------------------------------
    // Surface the engine's own file errors. The build streams every data
    // file with a blocking request, and a missing or truncated file only
    // ever reaches console.error before the load stalls, so mirror those
    // messages on screen with the path that failed.
    // ---------------------------------------------------------------
    var nativeError = console.error ? console.error.bind(console) : function () {};

    console.error = function () {
        nativeError.apply(null, arguments);
        var text = Array.prototype.map.call(arguments, function (part) {
            if (part instanceof Error) return part.message;
            if (typeof part === "object" && part !== null) {
                try { return JSON.stringify(part); } catch (e) { return String(part); }
            }
            return String(part);
        }).join(" ");

        // A single base failing is normal: the build tries the next one. Only
        // report a file that every base failed to supply.
        if (!/Rain World file (unavailable|manifest request failed)/i.test(text.trim())) return;

        var hint = /manifest request failed/i.test(text)
            ? "webport-files.json could not be read from the game folder or the game-assets branch."
            : "No source had that file, so the game continued without it. Run python3 sync_assets.py --verify to see what your local copy is missing.";
        showBanner("Rain World could not read a game file", text, hint);
    };

    window.addEventListener("error", function (event) {
        if (event && event.message) {
            showBanner("Rain World error", event.message,
                "Open the browser console for the full stack trace.");
        }
    });

    window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        showBanner("Rain World error",
            reason && reason.message ? reason.message : String(reason),
            "Open the browser console for the full stack trace.");
    });

    // Remember the last file the engine asked for, so a stall can be named.
    var lastRequest = "";
    var nativeOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url) {
        lastRequest = String(url);
        return nativeOpen.apply(this, arguments);
    };

    // ---------------------------------------------------------------
    // Locate the build and the asset tree before touching the loader.
    // ---------------------------------------------------------------
    function head(url) {
        return fetch(url, { method: "HEAD", cache: "no-store" })
            .then(function (response) {
                if (response.ok) return true;
                if (response.status === 405) return true; // HEAD refused, assume servable
                return false;
            })
            .catch(function () { return false; });
    }

    // A folder can hold the manifest and still be missing most of the data (an
    // extractor that skipped the WebPortBytes mirrors leaves the game without
    // its shaders and text). Spot-check files across the tree, including those
    // mirrors, before trusting a base.
    var SAMPLE_FILES = [
        "GameVersion.txt",
        "world/worldversion.txt",
        "world/regions.txt",
        "world/su-rooms/su_a02.txt",
        "WebPortBytes/text/text_eng/strings.txt.b64",
        "WebPortBytes/shaders/Blizzard.shader.b64"
    ];

    function complete(base) {
        var index = 0;
        function next() {
            if (index >= SAMPLE_FILES.length) return Promise.resolve(true);
            var url = base + ASSETS_PATH + "/" + SAMPLE_FILES[index++];
            return head(url).then(function (ok) { return ok ? next() : false; });
        }
        return next();
    }

    var rejectedBases = [];

    // A complete tree wins, but a folder that only has some of the data is still
    // worth using: reads come off the disk and only the gaps go to the network.
    function firstCompleteAssets() {
        var index = 0;
        var partial = null;
        function next() {
            if (index >= ASSET_BASES.length) return Promise.resolve(partial);
            var base = ASSET_BASES[index++];
            return head(base + ASSETS_PATH + "/webport-files.json").then(function (ok) {
                if (!ok) return next();
                return complete(base).then(function (good) {
                    if (good) return base;
                    if (partial === null) partial = base;
                    rejectedBases.push(base ? base : "./");
                    return next();
                });
            });
        }
        return next();
    }

    function firstAvailable(bases, relative) {
        var index = 0;
        function next() {
            if (index >= bases.length) return Promise.resolve(null);
            var base = bases[index++];
            return head(base + relative).then(function (ok) {
                return ok ? base : next();
            });
        }
        return next();
    }

    function fail(message, hint) {
        setStatus("Game failed to load");
        errorEl.textContent = message;
        showBanner("Rain World could not start", message, hint || "");
    }

    firstAvailable(BUILD_BASES, BUILD + ".loader.js").then(function (buildBase) {
        if (buildBase === null) {
            fail("Missing Build/WebGLUnity6Build.loader.js next to index.html.",
                "Upload the Build folder (loader, framework, wasm, data) to the repo root.");
            return null;
        }
        return firstCompleteAssets().then(function (assetBase) {
                if (assetBase === null) {
                    fail(rejectedBases.length
                            ? "StreamingAssets is there but incomplete."
                            : "Missing StreamingAssets/webport-files.json.",
                        rejectedBases.length
                            ? "Some of its data files are missing, including the WebPortBytes mirrors that hold the shaders and text. Run python3 sync_assets.py to fill the gaps."
                            : "The game streams its data from that folder. Upload StreamingAssets to the repo root, or put it on the game-assets branch.");
                    return null;
                }
                return { build: buildBase, assets: assetBase + ASSETS_PATH };
            });
    }).then(function (paths) {
        if (!paths) return null;
        return loadRegionPack().then(function () {
            return start(paths.build, paths.assets);
        });
    }).catch(function (reason) {
        fail(String(reason && reason.message ? reason.message : reason), "");
    });

    // ---------------------------------------------------------------
    // First-region pack. A new save wakes up in SU: 261 files, 44 MB, which the
    // port would otherwise pull one blocking request at a time. They ship as a
    // single gzipped pack that is decompressed here and mounted into the game's
    // file system before the engine starts, so nothing in that load waits on the
    // network. One request, one progress bar.
    // ---------------------------------------------------------------
    function loadRegionPack() {
        var url = "assets/region-su.pack.gz";
        if (typeof DecompressionStream !== "function" || typeof fetch !== "function") return Promise.resolve();

        setStatus("Fetching region data... 0%");
        return fetch(url, { cache: "force-cache" }).then(function (response) {
            if (!response.ok) throw new Error("region pack " + response.status);
            var total = Number(response.headers.get("content-length") || 0);
            var reader = response.body.getReader();
            var chunks = [];
            var received = 0;
            function pump() {
                return reader.read().then(function (step) {
                    if (step.done) return null;
                    chunks.push(step.value);
                    received += step.value.length;
                    var percent = total ? Math.min(99, Math.round(received / total * 100)) : 0;
                    progress.style.width = percent + "%";
                    setStatus("Fetching region data... " + percent + "%" +
                        (total ? " (" + formatBytes(received) + " of " + formatBytes(total) + ")" : ""));
                    hudShow(percent, "region data " + percent + "%",
                        formatBytes(received) + (total ? " of " + formatBytes(total) : ""));
                    lastProgress = Date.now();
                    return pump();
                });
            }
            return pump().then(function () {
                setStatus("Unpacking region data...");
                var blob = new Blob(chunks);
                return new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
            });
        }).then(function (buffer) {
            var view = new DataView(buffer);
            var headerLength = view.getUint32(0, true);
            var count = view.getUint32(4, true);
            var header = JSON.parse(new TextDecoder("utf-8").decode(new Uint8Array(buffer, 8, headerLength)));
            // The header is JSON, so its length is not 4-byte aligned and the
            // length table cannot be a Uint32Array view. Read it with a DataView.
            var lengthsAt = 8 + headerLength;
            var index = {};
            var offset = lengthsAt + count * 4;
            for (var i = 0; i < count; i++) {
                var length = view.getUint32(lengthsAt + i * 4, true);
                index[header.paths[i]] = [offset, length];
                offset += length;
            }
            window.rainWorldPack = { index: index, raw: new Uint8Array(buffer) };
            setStatus("Region data ready (" + count + " files)");
            progress.style.width = "0%";
            hudShow(100, "region data ready", count + " files in memory");
        }).catch(function (reason) {
            // Not fatal: without the pack the files come off the asset base.
            console.warn("Rain World region pack unavailable:", String(reason && reason.message ? reason.message : reason));
            progress.style.width = "0%";
        });
    }

    // ---------------------------------------------------------------
    // Boot
    // ---------------------------------------------------------------
    function loadScript(src) {
        return new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            script.src = src;
            script.onload = resolve;
            script.onerror = function () { reject(new Error("Could not download " + src)); };
            document.body.appendChild(script);
        });
    }

    // If the download itself stops moving, say so instead of leaving a bar
    // frozen at a percentage. Nothing here changes how the game loads.
    var lastProgress = Date.now();
    var lastPercent = 0;
    setInterval(function () {
        if (loading.style.display === "none") return;
        if (Date.now() - lastProgress < 45000) return;
        var waiting = lastRequest ? lastRequest.split("/").pop() : "";
        setStatus("Loading Rain World... stuck at " + lastPercent + "%" +
            (waiting ? " (last request: " + waiting + ")" : ""));
    }, 5000);

    function start(buildBase, assetsUrl) {
        setStatus("Loading Rain World...");
        // The build's patched file layer retries a failed file against these
        // bases, and prefetches from them in parallel, so one slow or missing
        // file cannot stall the load.
        var fallbacks = [];
        ASSET_BASES.forEach(function (base) {
            var candidate = base + ASSETS_PATH;
            if (candidate !== assetsUrl && fallbacks.indexOf(candidate) < 0) fallbacks.push(candidate);
        });
        window.rainWorldAssetFallbacks = fallbacks;
        // Prefetch only helps over the network, and it must never take the
        // connections the game's own blocking reads need from a local server.
        window.rainWorldRemote = /^https?:/i.test(assetsUrl);
        window.rainWorldAssetFallback = fallbacks.length ? fallbacks[0] : "";
        return loadScript(buildBase + BUILD + ".loader.js?v=" + BUILD_VERSION).then(function () {
            if (typeof createUnityInstance !== "function") {
                throw new Error("The Unity loader did not define createUnityInstance.");
            }
            return createUnityInstance(canvas, {
                dataUrl: buildBase + BUILD + ".data?v=" + BUILD_VERSION,
                frameworkUrl: buildBase + BUILD + ".framework.js?v=" + BUILD_VERSION,
                codeUrl: buildBase + BUILD + ".wasm?v=" + BUILD_VERSION,
                streamingAssetsUrl: assetsUrl,
                companyName: "Unknown",
                productName: "Rain World",
                productVersion: "1.0",
                showBanner: function (message, kind) {
                    if (kind === "error") showBanner("Rain World error", message, "");
                    else nativeError(message);
                }
            }, function (value) {
                var percent = Math.round(value * 100);
                progress.style.width = percent + "%";
                setStatus("Loading Rain World... " + percent + "%");
                hudShow(percent, "engine " + percent + "%", "downloading the game build");
                lastProgress = Date.now();
                lastPercent = percent;
            });
        }).then(function (instance) {
            window.gameInstance = instance;
            loading.style.display = "none";
            if (rejectedBases.length) {
                nativeError("StreamingAssets in " + rejectedBases.join(", ") +
                    " is incomplete, so assets are streamed from the game-assets branch.");
                hudShow(0, "StreamingAssets is missing some files", "those come from the asset branch");
            }
            watchAssets();
            canvas.focus();
        });
    }

    // Keyboard input needs the canvas focused; a click anywhere gives it back.
    document.addEventListener("pointerdown", function () { canvas.focus(); }, true);
    window.addEventListener("blur", function () { setTimeout(function () { canvas.focus(); }, 0); });

    // ---------------------------------------------------------------
    // Asset traffic readout. The port reads each data file with a blocking
    // request, so a region load blocks the page for a while; showing the
    // byte count makes progress visible instead of looking hung.
    // ---------------------------------------------------------------
    var formatBytes = function (bytes) {
        if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + " GB";
        if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
        return Math.round(bytes / 1024) + " KB";
    };

    // The patched build reports the file it is reading, so a slow load always
    // shows what it is waiting on instead of looking stuck.
    var currentFile = "";
    var currentFileAt = 0;
    var seenFiles = [];
    var HUD_PACKED = 0;
    var hudMissingCount = 0;
    var hudFillPercent = 0;
    function hudShow(percent, text, detail) {
        hudFillPercent = percent;
        hud.classList.remove("dim");
        hud.style.display = "block";
        hudFill.style.width = Math.max(0, Math.min(100, percent)) + "%";
        hudText.textContent = text;
        hudFiles.textContent = detail || "";
    }

    window.rainWorldFileStatus = function (info) {
        if (!info || !info.path) return;
        currentFile = String(info.path);
        currentFileAt = Date.now();
        if (info.packed) HUD_PACKED = info.packed;
        var folder = (info.dir || "").split("/").slice(-2).join("/");
        var percent = info.dirTotal ? (info.dirDone / info.dirTotal) * 100 : 0;
        var name = currentFile.split("/").slice(-1)[0];
        hudShow(percent,
            (folder ? folder + ": " + info.dirDone + "/" + info.dirTotal + " files" : "loading " + name) +
            " \u00b7 " + formatBytes(info.downloaded || 0) + " over " + (info.files || 0) + " requests",
            name + (info.recent && info.recent.length > 1
                ? "  \u2190 " + info.recent.slice(0, -1).reverse().map(function (entry) {
                    return entry.split("/").slice(-1)[0];
                }).join(", ")
                : ""));
        if (info.missing && info.missing.length && info.missing.length !== hudMissingCount) {
            hudMissingCount = info.missing.length;
            hudShow((info.dirTotal ? (info.dirDone / info.dirTotal) * 100 : 0),
                "missing asset: " + info.missing[info.missing.length - 1],
                info.missing.length + " file(s) not in any source, served zero bytes");
        }
        clearTimeout(window.__fileHide);
        window.__fileHide = setTimeout(function () {
            if (Date.now() - currentFileAt >= 3900) currentFile = "";
            hud.classList.add("dim");
        }, 4000);
    };

    function watchAssets() {
        var files = window.rainWorldFiles;
        if (!files) {
            setTimeout(watchAssets, 400);
            return;
        }
        var lastDownloads = -1;
        var lastBytes = -1;
        var lastChange = Date.now();
        var lastIdleReport = 0;

        function tick() {
            var downloads = files.downloads || 0;
            var bytes = files.downloadedBytes || 0;
            if (Date.now() - currentFileAt < 3900) {
                lastChange = Date.now();
            } else if (downloads !== lastDownloads || bytes !== lastBytes) {
                lastDownloads = downloads;
                lastBytes = bytes;
                lastChange = Date.now();
                hudShow(100, "engine running \u00b7 " + formatBytes(bytes) + " over " + downloads + " requests",
                    HUD_PACKED ? HUD_PACKED + " files came from the region pack" : "");
                hud.classList.add("dim");
            } else if (Date.now() - lastChange > 2500) {
                hud.classList.add("dim");
                var idle = Date.now() - lastChange;
                if (idle > 4000 && Date.now() - lastIdleReport > 1200) {
                    lastIdleReport = Date.now();
                    var logs = [];
                    try { logs = files.scanLogs ? files.scanLogs() : []; } catch (error) { logs = []; }
                    var line = consoleTail.length ? consoleTail[consoleTail.length - 1] : "";
                    var extra = consoleTail.length > 1 ? consoleTail[consoleTail.length - 2] : "";
                    hudShow(hudFillPercent || 0,
                        "engine quiet " + Math.round(idle / 1000) + "s \u00b7 " +
                            (consoleTail.length ? consoleTail.length + " console lines" : "silent"),
                        line || (logs.length ? logs[logs.length - 1] : "nothing was logged") +
                            (line && extra ? "  \u2190 " + extra.slice(-120) : ""));
                }
            }
            setTimeout(tick, 400);
        }
        tick();
    }
})();
</script>
