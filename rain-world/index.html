<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rain World</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}
#unity-canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
}
#loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(350px, 80%);
    color: white;
    text-align: center;
}
#bar {
    height: 10px;
    margin-top: 15px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
}
#progress {
    height: 100%;
    width: 0%;
    background: #8da85c;
}
#error {
    color: #ff7777;
    margin-top: 15px;
    overflow-wrap: anywhere;
}
</style>
</head>
<body>
<canvas id="unity-canvas"></canvas>
<div id="loading">
    <div id="status">Loading Rain World...</div>
    <div id="bar"><div id="progress"></div></div>
    <div id="error"></div>
</div>

<script src="Build/WebGLUnity6Build.loader.js"></script>
<script>
const canvas = document.querySelector("#unity-canvas");
const loading = document.querySelector("#loading");
const progress = document.querySelector("#progress");
const status = document.querySelector("#status");
const error = document.querySelector("#error");

createUnityInstance(canvas, {
    dataUrl: "Build/WebGLUnity6Build.data",
    frameworkUrl: "Build/WebGLUnity6Build.framework.js",
    codeUrl: "Build/WebGLUnity6Build.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Unknown",
    productName: "Rain World",
    productVersion: "1.0"
}, value => {
    progress.style.width = (value * 100) + "%";
    status.textContent = "Loading Rain World... " +
        Math.round(value * 100) + "%";
}).then(instance => {
    window.gameInstance = instance;
    loading.style.display = "none";
}).catch(reason => {
    status.textContent = "Game failed to load";
    error.textContent = reason;
    console.error(reason);
});
</script>
</body>
</html>
